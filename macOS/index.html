<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Flip Clock</title>
  <link rel="icon" href="icon.ico" sizes="any">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main aria-label="Flip clock">
    <div class="clock-layout">
    <header class="date-header" id="date-header"><div id="day"></div><div id="date"></div></header>
    <div class="clock" aria-hidden="true">
      <section class="card" id="hours"><div class="digits"></div><div class="corner" id="period"></div></section>
      <section class="card" id="minutes"><div class="digits"></div><div class="corner seconds" id="seconds"></div></section>
    </div>
    </div>
    <time id="accessible-time" class="sr-only"></time>
  </main>
  <nav class="toolbar" aria-label="Clock controls">
    <button id="timer-toggle" title="Countdown timer" aria-label="Countdown timer" aria-expanded="false" aria-controls="timer-panel"><svg viewBox="0 0 24 24"><circle cx="12" cy="14" r="8"/><path d="M9 2h6m-3 0v4m0 4v5l3 2"/></svg></button>
    <button id="settings-toggle" title="Settings (S)" aria-label="Settings" aria-expanded="false" aria-controls="settings"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M9 4v6M15 14v6"/></svg></button>
    <button id="fullscreen" title="Fullscreen (F)" aria-label="Toggle fullscreen"><svg viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg></button>
    <button id="theme" title="Switch theme (T)" aria-label="Switch theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button>
  </nav>
  <section id="settings" class="settings" aria-label="Clock settings" hidden>
    <div class="settings-heading"><h1>Make time yours.</h1><button id="close-settings" aria-label="Close settings">×</button></div>
    <h2>Clock theme</h2>
    <div id="theme-options" class="options" aria-label="Clock themes"></div>
    <h2>Wallpaper</h2>
    <div id="wallpaper-options" class="options wallpapers" aria-label="Wallpapers"></div>
    <div class="custom-background">
      <label class="upload-button">Choose your image<input id="background-file" type="file" accept="image/jpeg,image/png,image/webp,image/avif"></label>
      <div class="background-actions"><button id="use-custom" hidden>Use saved image</button><button id="remove-custom" hidden>Remove image</button></div>
      <p id="background-status" role="status">Your image stays on this device.</p>
      <label>Glass cards<input id="glass-enabled" type="checkbox" role="switch" checked></label>
      <label>Glass opacity<input id="glass-opacity" type="range" min="10" max="85" value="30" aria-label="Glass opacity"></label>
      <label>Glass blur<input id="glass-blur" type="range" min="0" max="40" value="16" aria-label="Glass blur"></label>
    </div>
    <label>24-hour time <input id="format" type="checkbox" role="switch"></label>
    <label>Show seconds <input id="show-seconds" type="checkbox" role="switch"></label>
    <label>Show date <input id="show-date" type="checkbox" role="switch"></label>
    <label>Flip animation <input id="animate" type="checkbox" role="switch"></label>
    <label>Tick-tock sound <input id="tick-sound" type="checkbox" role="switch"></label>
    <label>Keep awake in fullscreen <input id="keep-awake" type="checkbox" role="switch" checked></label>
    <p id="wake-status" role="status">Requesting keep-awake…</p>
    <label>Sound volume <input id="sound-volume" type="range" min="0" max="100" step="5" aria-label="Sound volume"></label>
    <label class="size-label" for="size">Clock size <input id="size" type="range" min="60" max="120" step="5"></label>
    <p>Your local time. A little less distraction.</p>
    <p class="shortcuts">F fullscreen · S settings · T theme</p>
  </section>
  <section id="timer-panel" class="settings timer-panel" aria-label="Countdown timer" hidden>
    <div class="settings-heading"><h1>Countdown timer</h1><button id="timer-close" aria-label="Close timer">×</button></div>
    <div class="timer-inputs">
      <label>Hours<input id="timer-hours" type="number" min="0" max="99" value="0"></label>
      <label>Minutes<input id="timer-minutes" type="number" min="0" max="59" value="5"></label>
      <label>Seconds<input id="timer-seconds" type="number" min="0" max="59" value="0"></label>
    </div>
    <div class="timer-presets" aria-label="Timer presets"><button data-duration="60">1 min</button><button data-duration="300">5 min</button><button data-duration="1500">25 min</button><button data-duration="3600">1 hour</button></div>
    <output id="timer-display" class="timer-display" aria-label="Time remaining">00:05:00</output>
    <div id="timer-status" role="status">Ready</div>
    <div class="timer-actions"><button id="timer-start">Start</button><button id="timer-reset">Reset</button><button id="timer-dismiss" hidden>Stop alarm</button></div>
    <label>Alarm when finished<input id="timer-alarm" type="checkbox" role="switch" checked></label>
    <p>Keep the app open and your PC awake to hear the alarm on time.</p>
  </section>
  <button id="timer-badge" class="timer-badge" hidden title="Open running timer"></button>
  <div id="audio-status" class="audio-status" role="status"></div>
  <div id="notice" role="status"></div>
  <script src="app.js"></script>
  <script src="timer.js"></script>
  <script src="background.js"></script>
  <script src="awake.js"></script>
</body>
</html>
