name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify JavaScript
        run: |
          node tests/verify.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/verify-background.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/verify-timer.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/verify-awake.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/verify-electron.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Download pinned WebView2 SDK
        run: |
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/1.0.4191.47/microsoft.web.webview2.1.0.4191.47.nupkg' -OutFile tools/screensaver/webview2.zip
          Expand-Archive tools/screensaver/webview2.zip tools/screensaver/sdk -Force
      - name: Build standalone Windows ZIP and setup installer
        run: |
          ./tools/Build-Screensaver.ps1
          npm run package:win
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tools/Build-Setup.ps1
          $verification = Start-Process releases/FlipClock-Setup.exe -ArgumentList /verify -Wait -PassThru -WindowStyle Hidden
          if ($verification.ExitCode) { throw 'Setup payload verification failed.' }
      - name: Verify Windows installation and uninstall in isolated directories
        run: ./tests/verify-windows-install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            releases/FlipClock-Setup.exe
            releases/Flip-Clock-Windows.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install packaging and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip xvfb libgtk-3-0 libnss3 libasound2 desktop-file-utils
      - run: npm ci
      - run: npm test
      - name: Check shell syntax
        run: |
          sh -n Linux/install-linux.sh
          sh -n Linux/launch-unix.sh
          sh -n tests/verify-linux-install.sh
      - name: Build and smoke-test standalone Linux app
        run: xvfb-run -a npm run package:linux
      - name: Verify Linux ZIP installation and update
        run: xvfb-run -a sh tests/verify-linux-install.sh "$GITHUB_WORKSPACE/releases/Flip-Clock-Linux.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: releases/Flip-Clock-Linux.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check installer syntax
        run: sh -n 'macOS/Install macOS.command'
      - name: Build and smoke-test universal Electron app
        run: npm run package:mac
      - name: Test ZIP installation and update in an isolated home directory
        run: sh tests/verify-mac-install.sh "$GITHUB_WORKSPACE/releases/Flip-Clock-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: releases/Flip-Clock-macOS.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: releases
          merge-multiple: true
      - name: Generate checksums
        working-directory: releases
        run: sha256sum FlipClock-Setup.exe Flip-Clock-Windows.zip Flip-Clock-Linux.zip Flip-Clock-macOS.zip > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" releases/FlipClock-Setup.exe releases/Flip-Clock-Windows.zip releases/Flip-Clock-Linux.zip releases/Flip-Clock-macOS.zip releases/SHA256SUMS.txt --verify-tag --title "Flip Clock $RELEASE_TAG" --notes-file RELEASE_NOTES.md
